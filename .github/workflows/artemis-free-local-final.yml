name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_LLM_LIBRARY: cpu
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev

          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          rm -f "$HOME/.android/adbkey" "$HOME/.android/adbkey.pub"
          adb keygen "$HOME/.android/adbkey" >/tmp/adb-keygen.log 2>&1
          chmod 600 "$HOME/.android/adbkey"

          ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check

          rm -rf "${ANDROID_AVD_HOME}/artemis.avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          printf "\n" | timeout 60 avdmanager create avd --force \
            --name artemis \
            --package "system-images;android-34;google_apis;x86_64" \
            --abi "x86_64" \
            --path "${ANDROID_AVD_HOME}/artemis.avd"

          test -f "${ANDROID_AVD_HOME}/artemis.avd/config.ini"
          grep -Fx "artemis" <<< "$(emulator -list-avds)"

          nohup emulator @artemis \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -no-metrics -gpu swiftshader_indirect -accel on \
            > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n "1,25p"

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct
          curl -fsS http://127.0.0.1:11434/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}' \
            | tee /tmp/qwen-smoke.json

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"

          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.config.llm import LLM
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider

              _local_model = os.environ.get("ARTEMIS_LOCAL_MODEL", "qwen3-vl:2b-instruct")
              _local_base = os.environ.get("OPENAI_BASE_URL", "http://127.0.0.1:11434/v1")

              def _local_validate_provider(self, name: str) -> None:
                  return None

              LLM.validate_provider = _local_validate_provider

              def _coerce_local(endpoint: ModelEndpoint) -> ModelEndpoint:
                  if endpoint.provider == ModelProvider.OLLAMA:
                      return endpoint.model_copy(update={"api_base": endpoint.api_base or _local_base})
                  return endpoint.model_copy(update={
                      "provider": ModelProvider.OLLAMA,
                      "model_name": _local_model,
                      "api_key": "ollama",
                      "api_base": _local_base,
                  })

              _original_get_model = ModelFactory.get_model.__func__
              _original_create_model = ModelFactory.create_model.__func__

              @classmethod
              def _local_get_model(cls, endpoint):
                  return _original_get_model(cls, _coerce_local(endpoint))

              @classmethod
              def _local_create_model(cls, endpoint):
                  return _original_create_model(cls, _coerce_local(endpoint))

              ModelFactory.get_model = _local_get_model
              ModelFactory.create_model = _local_create_model
          PY

          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local${PYTHONPATH:+:$PYTHONPATH}"
          uv run python - <<'PY'
          from artemis.config.llm import LLM
          from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
          LLM(provider="google", model="gemini-test").validate_provider("Planner")
          endpoint = ModelEndpoint(provider=ModelProvider.GOOGLE, model_name="gemini-test")
          model = ModelFactory.get_model(endpoint)
          print("LOCAL_VALIDATION_OK")
          print("LOCAL_MODEL_TYPE", type(model).__name__)
          print("LOCAL_BASE_URL", getattr(model, "openai_api_base", None))
          PY

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local${PYTHONPATH:+:$PYTHONPATH}"

          echo "=== FINAL ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run \
            "Open Settings and report the battery percentage" \
            --profile flash \
            --without-video-recording-tools \
            --disable-step-summarizer \
            --disable-outputter \
            --disable-checker \
            --disable-planner-validation \
            --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery
          tail -250 /tmp/emulator.log
          journalctl -u ollama --no-pager -n 200
