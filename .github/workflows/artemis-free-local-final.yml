name: Artemis Free Local Final
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      OLLAMA_LLM_LIBRARY: cpu
      OLLAMA_NO_CLOUD: "1"

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1
          sudo ldconfig
          sudo ln -sf libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so
          export ANDROID_SDK_HOME="$RUNNER_TEMP/android-sdk-home"
          export ANDROID_USER_HOME="$ANDROID_SDK_HOME/.android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_SDK_HOME" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            ${{ runner.temp }}/ollama-models
          key: artemis-local-v2

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check
          if [ ! -f "$ANDROID_AVD_HOME/artemis.avd/config.ini" ]; then
            echo no | avdmanager create avd --force --name artemis --package "system-images;android-34;google_apis;x86_64" --abi x86_64 --device pixel_2 --path "$ANDROID_AVD_HOME/artemis.avd"
          fi
          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx artemis
          rm -f "$ANDROID_EMULATOR_HOME/emu-update-last-check.ini"
          adb start-server
          nohup emulator @artemis -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -no-metrics > /tmp/emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          for _ in $(seq 1 180); do
            adb shell getprop sys.boot_completed | grep -q '^1' && break
            sleep 2
          done
          adb shell getprop sys.boot_completed | grep -q '^1'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Configure local LLM
        shell: bash
        run: |
          set -euxo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          p = Path("config/artemis.jsonc")
          s = p.read_text(encoding="utf-8")

          old_default = (
              '  "default": {\n'
              '    "provider": "google",\n'
              '    "model": "gemini-3.8-flash",\n'
              '    "thinking_level": "medium",\n'
              '    "fallback": {\n'
              '      "provider": "google",\n'
              '      "model": "gemini-3.7-flash",\n'
              '      "thinking_level": "medium"\n'
              '    }\n'
              '  },'
          )

          new_default = (
              '  "default": {\n'
              '    "provider": "openai",\n'
              '    "model": "qwen3-vl:2b-instruct",\n'
              '    "thinking_level": "medium",\n'
              '    "fallback": {\n'
              '      "provider": "openai",\n'
              '      "model": "qwen3-vl:2b-instruct",\n'
              '      "thinking_level": "medium"\n'
              '    }\n'
              '  },'
          )

          if s.count(old_default) != 1:
              raise SystemExit("Expected exactly one default LLM block")
          s = s.replace(old_default, new_default, 1)

          old_turns = '      "max_turns": 0, // Maximum reactive turns before stopping (0 = unlimited; history is bounded by transcript compression, not by a turn cap)'
          new_turns = '      "max_turns": 3, // CI smoke-test bound: prevent an unlimited local Flash loop'

          if s.count(old_turns) != 1:
              raise SystemExit("Expected exactly one flash max_turns=0 entry")
          s = s.replace(old_turns, new_turns, 1)

          p.write_text(s, encoding="utf-8")
          print("LOCAL_CONFIG_READY")
          PY

      - name: Validate local Artemis config
        shell: bash
        run: |
          set -euxo pipefail
          grep -F '"max_turns": 3' config/artemis.jsonc
          uv run python - <<'PY'
          from artemis.config import initialize_llm_config

          cfg = initialize_llm_config()
          planner = cfg.get_agent("planner")
          operator = cfg.get_agent("operator")

          assert planner.provider == "openai"
          assert planner.model == "qwen3-vl:2b-instruct"
          assert planner.fallback is not None
          assert planner.fallback.provider == "openai"
          assert planner.fallback.model == "qwen3-vl:2b-instruct"

          assert operator.provider == "openai"
          assert operator.model == "qwen3-vl:2b-instruct"

          print("ARTEMIS_CONFIG_VALID")
          print("PLANNER", planner.provider, planner.model)
          print("OPERATOR", operator.provider, operator.model)
          PY

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          echo "OLLAMA_MODELS=$OLLAMA_MODELS" >> "$GITHUB_ENV"
          command -v ollama > /dev/null 2>&1 || curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl disable --now ollama || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
          OLLAMA_MODELS="$OLLAMA_MODELS" ollama pull qwen3-vl:2b-instruct
          curl -fsS http://127.0.0.1:11434/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}' > /tmp/qwen-smoke.json
          curl -fsS http://127.0.0.1:11434/api/generate -H 'Content-Type: application/json' -d '{"model":"qwen3-vl:2b-instruct","prompt":"","keep_alive":"10m"}' > /tmp/qwen-warm.json

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"
          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.config.llm import LLMConfig
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              local_model = os.environ.get(
                  "ARTEMIS_LOCAL_MODEL",
                  "qwen3-vl:2b-instruct",
              )
              local_base = os.environ.get(
                  "OPENAI_BASE_URL",
                  "http://127.0.0.1:11434/v1",
              )

              def _skip_provider_validation(self):
                  # Local-only mode routes every provider through Ollama.
                  return None

              LLMConfig.validate_providers = _skip_provider_validation

              _original_create_model = ModelFactory.create_model

              def _local_create_model(cls, endpoint: ModelEndpoint):
                  local_endpoint = endpoint.model_copy(
                      update={
                          "provider": ModelProvider.OLLAMA,
                          "model_name": local_model,
                          "api_key": "ollama",
                          "api_base": local_base,
                          "enable_grounding": False,
                          "thinking_budget": None,
                          "thinking_level": None,
                      }
                  )
                  return _original_create_model(local_endpoint)

              ModelFactory.create_model = classmethod(_local_create_model)

              def _local_google_llm(
                  model_name="gemini-3.8-flash",
                  temperature=None,
                  timeout=None,
                  thinking_budget=None,
                  thinking_level="medium",
                  include_thoughts=None,
                  enable_grounding=False,
              ):
                  endpoint = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=local_model,
                      api_key="ollama",
                      api_base=local_base,
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return _original_create_model(endpoint)

              llm_service.get_google_llm = _local_google_llm
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          import artemis.services.llm as s
          m = s.get_google_llm(model_name="gemini-2.5-flash")
          base = str(getattr(m, "base_url", ""))
          print("LOCAL_FACTORY_TYPE", type(m).__name__)
          print("LOCAL_FACTORY_BASE_URL", base)
          assert "11434/v1" in base, base
          PY

      - name: Run Artemis local-only
        shell: bash
        env:
          PYTHONPATH: $GITHUB_WORKSPACE/.artemis-local
        run: |
          set -euxo pipefail
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2
          uv run artemis run "Open Settings and report the battery percentage" --profile flash --without-video-recording-tools --disable-step-summarizer --disable-outputter --disable-checker --disable-planner-validation --standalone

      - name: Diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery || true
          tail -200 /tmp/emulator.log || true
          journalctl -u ollama --no-pager -n 160 || true
          tail -200 /tmp/ollama.log || true
