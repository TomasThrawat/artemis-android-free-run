name: Artemis Free Local Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev
          sudo ldconfig
          if [ ! -e /usr/lib/x86_64-linux-gnu/libX11-xcb.so ]; then
            sudo ln -s libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so
          fi

          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$HOME/.android"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so

          rm -rf "$ANDROID_AVD_HOME/artemis.avd"
          mkdir -p "$ANDROID_AVD_HOME"

          printf '\n' | timeout 60 avdmanager create avd \
            --force \
            --name artemis \
            --package "system-images;android-34;google_apis;x86_64" \
            --abi "x86_64" \
            --path "$ANDROID_AVD_HOME/artemis.avd"

          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx artemis

          adb keygen "$HOME/.android/adbkey" >/dev/null 2>&1 || true
          chmod 600 "$HOME/.android/adbkey" "$HOME/.android/adbkey.pub" 2>/dev/null || true

          nohup emulator @artemis \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -accel on \
            > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.ollama
            ${{ runner.temp }}/android-avd
          key: artemis-local-${{ runner.os }}-${{ hashFiles('uv.lock', 'config/artemis.jsonc', '.github/workflows/artemis-free-local-final.yml') }}
          restore-keys: |
            artemis-local-${{ runner.os }}-

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Configure Artemis for local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("config/artemis.jsonc")
          s = p.read_text(encoding="utf-8")

          provider_pattern = r'("provider"\s*:\s*")([^"]+)(")'
          model_pattern = r'("model"\s*:\s*")([^"]+)(")'

          s = re.sub(provider_pattern, lambda m: m.group(1) + "ollama" + m.group(3), s)
          s = re.sub(model_pattern, lambda m: m.group(1) + "qwen3-vl:2b-instruct" + m.group(3), s)

          p.write_text(s, encoding="utf-8")

          providers = sorted(set(re.findall(r'"provider"\s*:\s*"([^"]+)"', s)))
          models = sorted(set(re.findall(r'"model"\s*:\s*"([^"]+)"', s)))

          print("LOCAL_PROVIDERS", providers)
          print("LOCAL_MODELS", models)

          assert providers == ["ollama"], providers
          assert models == ["qwen3-vl:2b-instruct"], models
          PY

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}' \
            | tee /tmp/qwen-smoke.json

      - name: Configure Artemis for local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("config/artemis.jsonc")
          s = p.read_text(encoding="utf-8")
          edits = [
              (r'("default"\s*:\s*\{\s*"provider"\s*:\s*)"google"', r'"openai"'),
              (r'("default"\s*:\s*\{.*?"model"\s*:\s*)"gemini-3\.8-flash"', r'"qwen3-vl:2b-instruct"'),
              (r'("default"\s*:\s*\{.*?"fallback"\s*:\s*\{\s*"provider"\s*:\s*)"google"', r'"openai"'),
              (r'("default"\s*:\s*\{.*?"fallback"\s*:\s*\{.*?"model"\s*:\s*)"gemini-3\.7-flash"', r'"qwen3-vl:2b-instruct"'),
          ]
          counts=[]
          for pat,rep in edits:
              s,n=re.subn(pat,rep,s,count=1,flags=re.S)
              counts.append(n)
          if counts != [1,1,1,1]:
              raise SystemExit(f"Unexpected config shape: {counts}")
          p.write_text(s,encoding="utf-8")
          print("LOCAL_CONFIG_READY")
          PY
      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"

          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              def _local_google_llm(
                  model_name: str = "gemini-3.8-flash",
                  temperature: float | None = None,
                  timeout: float | None = None,
                  thinking_budget: int | None = None,
                  thinking_level: str | None = "medium",
                  include_thoughts: bool | None = None,
                  enable_grounding: bool = False,
              ):
                  ep = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=os.environ.get(
                          "ARTEMIS_LOCAL_MODEL",
                          "qwen3-vl:2b-instruct",
                      ),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return ModelFactory.create_model(ep)

              llm_service.get_google_llm = _local_google_llm
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          import artemis.services.llm as s
          m = s.get_google_llm(model_name="gemini-2.5-flash")
          print("LOCAL_FACTORY_TYPE", type(m).__name__)
          print("LOCAL_FACTORY_BASE_URL", getattr(m, "base_url", None))
          PY

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== FINAL ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run \
            "Open Settings and report the battery percentage" \
            --profile flash \
            --without-video-recording-tools \
            --disable-step-summarizer \
            --disable-outputter \
            --disable-checker \
            --disable-planner-validation \
            --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          printf "ANDROID_SDK_HOME=%s
ANDROID_USER_HOME=%s
ANDROID_EMULATOR_HOME=%s
ANDROID_AVD_HOME=%s
" "$ANDROID_SDK_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME"
          adb shell dumpsys battery
          tail -200 /tmp/emulator.log
          journalctl -u ollama --no-pager -n 160
