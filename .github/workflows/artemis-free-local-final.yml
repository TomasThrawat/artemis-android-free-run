name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$HOME/.local/bin:$PATH"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev

          ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/emu-update-last-check.ini"
          chmod 600 "$HOME/.android/emu-update-last-check.ini"

          # Generate the ADB host key before the emulator launches.
          adb start-server

          # Avoid the emulator probe warning for the unversioned XCB library.
          if [ ! -e /usr/lib/x86_64-linux-gnu/libX11-xcb.so ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so
          fi

          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check

          rm -rf "${ANDROID_AVD_HOME}/artemis.avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          printf '\n' | timeout 60 avdmanager create avd             --force             --name artemis             --package "system-images;android-34;google_apis;x86_64"             --abi "x86_64"             --path "${ANDROID_AVD_HOME}/artemis.avd"

          test -f "${ANDROID_AVD_HOME}/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx "artemis"

          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -no-metrics             -gpu swiftshader_indirect -accel on             > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Configure Artemis for local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail

          # Artemis validates every configured provider at startup.
          # Route the complete test configuration to local Ollama.
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("config/artemis.jsonc")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'("provider"\s*:\s*")([^"]+)(")', r'\1ollama\3', s)
          s = re.sub(r'("model"\s*:\s*")([^"]+)(")', r'\1qwen3-vl:2b-instruct\3', s)
          p.write_text(s, encoding="utf-8")

          assert '"provider": "ollama"' in s
          assert '"model": "qwen3-vl:2b-instruct"' in s
          assert '"provider": "google"' not in s
          assert '"provider": "openai"' not in s
          PY

          grep -nE '"provider"|"model"' config/artemis.jsonc | head -80

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"

          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              _original_create_model = ModelFactory.create_model

              def _local_create_model(cls, endpoint):
                  provider = ModelProvider.from_string(endpoint.provider)
                  if provider == ModelProvider.GOOGLE:
                      endpoint = endpoint.model_copy(
                          update={
                              "provider": ModelProvider.OLLAMA,
                              "model_name": os.environ.get(
                                  "ARTEMIS_LOCAL_MODEL",
                                  "qwen3-vl:2b-instruct",
                              ),
                              "api_key": os.environ.get("OPENAI_API_KEY", "ollama"),
                              "api_base": os.environ.get(
                                  "OPENAI_BASE_URL",
                                  "http://127.0.0.1:11434/v1",
                              ),
                              "thinking_budget": None,
                              "thinking_level": None,
                              "enable_grounding": False,
                          }
                      )
                  return _original_create_model(endpoint)

              ModelFactory.create_model = classmethod(_local_create_model)

              def _local_google_llm(
                  model_name: str = "gemini-3.8-flash",
                  temperature: float | None = None,
                  timeout: float | None = None,
                  thinking_budget: int | None = None,
                  thinking_level: str | None = "medium",
                  include_thoughts: bool | None = None,
                  enable_grounding: bool = False,
              ):
                  ep = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=os.environ.get(
                          "ARTEMIS_LOCAL_MODEL",
                          "qwen3-vl:2b-instruct",
                      ),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return ModelFactory.create_model(ep)

              llm_service.get_google_llm = _local_google_llm
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
          import artemis.services.llm as s

          m = s.get_google_llm(model_name="gemini-2.5-flash")
          print("LOCAL_FACTORY_TYPE", type(m).__name__)
          print("LOCAL_FACTORY_BASE_URL", getattr(m, "base_url", None))

          direct = ModelFactory.create_model(
              ModelEndpoint(
                  provider=ModelProvider.GOOGLE,
                  model_name="gemini-2.5-flash",
              )
          )
          print("DIRECT_GOOGLE_FACTORY_TYPE", type(direct).__name__)
          print("DIRECT_GOOGLE_FACTORY_BASE_URL", getattr(direct, "base_url", None))
          assert "Google" not in type(direct).__name__
          PY

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local"

          echo "=== FINAL ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery
          tail -200 /tmp/emulator.log
          journalctl -u ollama --no-pager -n 160
