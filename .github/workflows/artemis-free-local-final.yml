name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev

          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          if [ ! -f "$HOME/.android/adbkey" ]; then "$ANDROID_HOME/platform-tools/adb" keygen "$HOME/.android/adbkey"; fi

          ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check

          rm -rf "${ANDROID_AVD_HOME}/artemis.avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          echo "no" | avdmanager create avd             -n artemis             -k "system-images;android-34;google_apis;x86_64"

          test -f "${ANDROID_AVD_HOME}/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx "artemis"

          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect -accel on -debug-no-metrics             > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"

          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from pydantic import BaseModel
              from artemis.config import llm as config_llm
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.config as config_pkg
              import artemis.services.llm as llm_service

              LOCAL_MODEL = os.environ.get("ARTEMIS_LOCAL_MODEL", "qwen3-vl:2b-instruct")
              LOCAL_BASE = os.environ.get("OPENAI_BASE_URL", "http://127.0.0.1:11434/v1")

              def _localize(value):
                  if isinstance(value, config_llm.LLMWithFallback):
                      return value.model_copy(update={
                          "provider": "ollama",
                          "model": LOCAL_MODEL,
                          "fallback": _localize(value.fallback),
                      })
                  if isinstance(value, config_llm.LLM):
                      return value.model_copy(update={
                          "provider": "ollama",
                          "model": LOCAL_MODEL,
                      })
                  if isinstance(value, list):
                      return [_localize(item) for item in value]
                  if isinstance(value, tuple):
                      return tuple(_localize(item) for item in value)
                  if isinstance(value, dict):
                      return {key: _localize(item) for key, item in value.items()}
                  if isinstance(value, BaseModel):
                      updates = {}
                      for field_name in value.model_fields:
                          current = getattr(value, field_name)
                          localized = _localize(current)
                          if localized is not current:
                              updates[field_name] = localized
                      return value.model_copy(update=updates) if updates else value
                  return value

              _original_parse = config_llm.parse_llm_config

              def _local_parse_llm_config():
                  return _localize(_original_parse())

              config_llm.parse_llm_config = _local_parse_llm_config
              config_llm.get_default_llm_config = _local_parse_llm_config
              config_pkg.parse_llm_config = _local_parse_llm_config
              config_pkg.get_default_llm_config = _local_parse_llm_config

              _original_judge_default = config_llm.lightweight_judge_default

              def _local_judge_default():
                  return _localize(_original_judge_default())

              config_llm.lightweight_judge_default = _local_judge_default
              config_pkg.lightweight_judge_default = _local_judge_default

              _original_create_model = ModelFactory.create_model
              _original_get_model = ModelFactory.get_model

              def _local_endpoint(endpoint):
                  provider = getattr(endpoint, "provider", None)
                  provider_value = getattr(provider, "value", provider)
                  if provider_value in {"google", "vertexai"}:
                      return endpoint.model_copy(update={
                          "provider": ModelProvider.OLLAMA,
                          "model_name": LOCAL_MODEL,
                          "api_key": "ollama",
                          "api_base": LOCAL_BASE,
                      })
                  return endpoint

              @classmethod
              def _local_create_model(cls, endpoint):
                  return _original_create_model(_local_endpoint(endpoint))

              @classmethod
              def _local_get_model(cls, endpoint):
                  return _original_get_model(_local_endpoint(endpoint))

              ModelFactory.create_model = _local_create_model
              ModelFactory.get_model = _local_get_model

              def _local_google_llm(
                  model_name: str = "gemini-3.8-flash",
                  temperature: float | None = None,
                  timeout: float | None = None,
                  thinking_budget: int | None = None,
                  thinking_level: str | None = "medium",
                  include_thoughts: bool | None = None,
                  enable_grounding: bool = False,
              ):
                  return ModelFactory.create_model(ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=LOCAL_MODEL,
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                      api_key="ollama",
                      api_base=LOCAL_BASE,
                  ))

              def _local_vertex_llm(*args, **kwargs):
                  return _local_google_llm()

              llm_service.get_google_llm = _local_google_llm
              llm_service.get_vertex_llm = _local_vertex_llm
          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              def _local_google_llm(
                  model_name: str = "gemini-3.8-flash",
                  temperature: float | None = None,
                  timeout: float | None = None,
                  thinking_budget: int | None = None,
                  thinking_level: str | None = "medium",
                  include_thoughts: bool | None = None,
                  enable_grounding: bool = False,
              ):
                  ep = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=os.environ.get(
                          "ARTEMIS_LOCAL_MODEL",
                          "qwen3-vl:2b-instruct",
                      ),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return ModelFactory.create_model(ep)

              llm_service.get_google_llm = _local_google_llm
          PY

          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          import artemis.services.llm as s
          m = s.get_google_llm(model_name="gemini-2.5-flash")
          print("LOCAL_FACTORY_TYPE", type(m).__name__)
          print("LOCAL_FACTORY_BASE_URL", getattr(m, "base_url", None))
          PY

      - name: Run Artemis local-only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.artemis-local
        run: |
          set -euxo pipefail

          echo "=== FINAL ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery
          tail -200 /tmp/emulator.log
          journalctl -u ollama --no-pager -n 160
