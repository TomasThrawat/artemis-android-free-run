name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev

          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_USER_HOME/.android"

          touch "$ANDROID_USER_HOME/.android/emu-update-last-check.ini"
          if [ ! -f "$ANDROID_USER_HOME/.android/adbkey" ]; then
            "$ANDROID_HOME/platform-tools/adb" keygen "$ANDROID_USER_HOME/.android/adbkey"
          fi

          X11_XCB="$(
            ldconfig -p 2>/dev/null |
            awk '/libX11-xcb.so.1/{print $NF; exit}'
          )"
          if [ -n "$X11_XCB" ]; then
            X11_DIR="$(dirname "$X11_XCB")"
            if [ ! -e "$X11_DIR/libX11-xcb.so" ]; then
              sudo ln -s "$X11_XCB" "$X11_DIR/libX11-xcb.so"
            fi
          fi

          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager             "emulator"             "platform-tools"             "platforms;android-34"             "system-images;android-34;google_apis;x86_64"

          emulator -accel-check

          rm -rf "$ANDROID_AVD_HOME/artemis.avd"
          mkdir -p "$ANDROID_AVD_HOME"

          timeout 90 avdmanager create avd             --force             --name artemis             --package "system-images;android-34;google_apis;x86_64"             --abi "x86_64"             --path "$ANDROID_AVD_HOME/artemis.avd"             <<< ""

          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          grep -Fx "artemis" < <(emulator -list-avds)

          export ADB_VENDOR_KEYS="$ANDROID_USER_HOME/.android/adbkey"

          nohup emulator @artemis             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -wipe-data             -no-metrics             -gpu swiftshader_indirect             -accel on             > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 180 adb wait-for-device

          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv pip install --python .venv/bin/python langchain-ollama
          uv run python --version

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Configure Artemis for local Ollama
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("config/artemis.jsonc")
          text = path.read_text(encoding="utf-8")

          text, providers = re.subn(
              r'("provider"\s*:\s*)"[^"]+"',
              r'\1"ollama"',
              text,
          )
          text, models = re.subn(
              r'("model"\s*:\s*)"[^"]+"',
              r'\1"qwen3-vl:2b-instruct"',
              text,
          )

          if not providers or not models:
              raise SystemExit(
                  f"Local config rewrite matched nothing: providers={providers}, models={models}"
              )

          path.write_text(text, encoding="utf-8")
          print(f"LOCAL_CONFIG_REWRITTEN providers={providers} models={models}")
          PY

          if grep -nE '"provider"[[:space:]]*:[[:space:]]*"(google|openai|anthropic|openrouter|xai|vertexai)"' config/artemis.jsonc; then
            echo "Non-local provider remains"
            exit 1
          fi

          if grep -nE '"model"[[:space:]]*:[[:space:]]*"gemini-' config/artemis.jsonc; then
            echo "Gemini model remains"
            exit 1
          fi

      - name: Install local-only runtime guard
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"

          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              import artemis.services.llm as llm_service
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider

              def _local_google_llm(
                  model_name="gemini-3.8-flash",
                  temperature=None,
                  timeout=None,
                  thinking_budget=None,
                  thinking_level="medium",
                  include_thoughts=None,
                  enable_grounding=False,
              ):
                  endpoint = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=os.environ.get(
                          "ARTEMIS_LOCAL_MODEL",
                          "qwen3-vl:2b-instruct",
                      ),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return ModelFactory.create_model(endpoint)

              llm_service.get_google_llm = _local_google_llm
          PY

      - name: Verify local Artemis routing
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.artemis-local
        run: |
          set -euxo pipefail

          uv run python - <<'PY'
          import os
          from artemis.config import initialize_llm_config
          from artemis.services.llm import get_llm

          assert os.environ["ARTEMIS_LOCAL_ONLY"] == "1"

          config = initialize_llm_config()

          for role in ("planner", "operator", "explorer"):
              cfg = config.get_agent(role)
              provider = getattr(cfg, "provider", None)
              model = getattr(cfg, "model", None)
              print(f"{role}: provider={provider} model={model}")
              if provider != "ollama":
                  raise SystemExit(f"{role} resolved to {provider!r}, not ollama")

          class Context:
              llm_config = config

          planner = get_llm(Context(), "planner")
          print("LOCAL_PLANNER_TYPE", type(planner).__name__)
          PY

      - name: Verify local Qwen tool calling
        shell: bash
        run: |
          set -euxo pipefail

          uv run python - <<'PY'
          from langchain_ollama import ChatOllama
          from langchain_core.tools import tool

          @tool
          def tap(x: int, y: int) -> str:
              """Android tap action."""
              return f"tap({x},{y})"

          llm = ChatOllama(
              model="qwen3-vl:2b-instruct",
              base_url="http://127.0.0.1:11434",
              temperature=0.0,
          ).bind_tools([tap], tool_choice="required")

          response = llm.invoke(
              "Call the tap tool exactly once with x=1 and y=2. Do not answer with prose."
          )

          if not response.tool_calls:
              raise SystemExit("Qwen did not produce a tool call")

          print("LOCAL_QWEN_TOOL_CALL_OK", response.tool_calls[0])
          PY

      - name: Run Artemis local-only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.artemis-local
        run: |
          set -euxo pipefail

          echo "=== ADB ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== ADB ==="
          adb devices -l
          echo "=== BATTERY ==="
          adb shell dumpsys battery
          echo "=== EMULATOR LOG ==="
          tail -250 /tmp/emulator.log
          echo "=== OLLAMA LOG ==="
          tail -250 /tmp/ollama.log 2>/dev/null
          echo "=== OLLAMA SERVICE ==="
          journalctl -u ollama --no-pager -n 200 2>/dev/null
