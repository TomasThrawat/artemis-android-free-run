name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /home/runner/.ollama/models
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            /home/runner/.cache/uv
            /home/runner/.ollama/models
          key: artemis-free-android34-qwen3vl-v5
          restore-keys: |
            artemis-free-android34-qwen3vl-

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

          if ! dpkg -s libpulse0 >/dev/null 2>&1 || ! dpkg -s libx11-xcb1 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libpulse0 libx11-xcb1
          fi

          if [ -e /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1 ] && [ ! -e /usr/lib/x86_64-linux-gnu/libX11-xcb.so ]; then
            sudo ln -s libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so
          fi

          mkdir -p $HOME/.android
          touch $HOME/.android/emu-update-last-check.ini

          mkdir -p $RUNNER_TEMP/android-user-home
          mkdir -p $RUNNER_TEMP/android-emulator-home
          echo ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home >> $GITHUB_ENV
          echo ANDROID_EMULATOR_HOME=$RUNNER_TEMP/android-emulator-home >> $GITHUB_ENV

          echo $ANDROID_HOME/emulator >> $GITHUB_PATH
          echo $ANDROID_HOME/platform-tools >> $GITHUB_PATH
          echo $ANDROID_HOME/cmdline-tools/latest/bin >> $GITHUB_PATH
          echo $HOME/.local/bin >> $GITHUB_PATH

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          if [ ! -x $ANDROID_HOME/emulator/emulator ] ||              [ ! -x $ANDROID_HOME/platform-tools/adb ] ||              [ ! -d $ANDROID_HOME/platforms/android-34 ] ||              [ ! -d $ANDROID_HOME/system-images/android-34/google_apis/x86_64 ]; then
            sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          fi

          emulator -accel-check

          rm -rf $ANDROID_EMULATOR_HOME/artemis.avd
          printf '
' | timeout 60 avdmanager create avd             --force             --name artemis             --package "system-images;android-34;google_apis;x86_64"             --abi x86_64             --path $ANDROID_EMULATOR_HOME/artemis.avd

          test -f $ANDROID_EMULATOR_HOME/artemis.avd/config.ini
          emulator -list-avds | grep -Fx artemis

          adb start-server
          test -e $HOME/.android/adbkey

          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect -accel on             > /tmp/emulator.log 2>&1 &

          timeout 240 adb wait-for-device

          for i in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '')" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '')" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          sudo systemctl stop ollama >/dev/null 2>&1 || true
          mkdir -p $OLLAMA_MODELS

          nohup env OLLAMA_HOST=$OLLAMA_HOST OLLAMA_MODELS=$OLLAMA_MODELS ollama serve             > /tmp/ollama.log 2>&1 &

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Configure local-only LLM
        shell: bash
        run: |
          set -euxo pipefail

          cat > $RUNNER_TEMP/artemis-local.jsonc <<'JSONC'
          {
            "default": {
              "provider": "ollama",
              "model": "qwen3-vl:2b-instruct",
              "temperature": 0.0,
              "thinking_level": "minimal",
              "fallback": {
                "provider": "ollama",
                "model": "qwen3-vl:2b-instruct",
                "temperature": 0.0,
                "thinking_level": "minimal"
              }
            }
          }
          JSONC

          echo ARTEMIS_ARTEMIS_JSONC=$RUNNER_TEMP/artemis-local.jsonc >> $GITHUB_ENV

          PYTHONPATH=$GITHUB_WORKSPACE/.artemis-local uv run python - <<'PY'
          from artemis.config import initialize_llm_config
          cfg = initialize_llm_config()
          assert str(cfg.planner.provider) == "ollama"
          assert str(cfg.operator.provider) == "ollama"
          assert cfg.planner.model == "qwen3-vl:2b-instruct"
          assert cfg.operator.model == "qwen3-vl:2b-instruct"
          print("LOCAL_LLM_CONFIG_OK")
          PY

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p $GITHUB_WORKSPACE/.artemis-local

          cat > $GITHUB_WORKSPACE/.artemis-local/sitecustomize.py <<'PY'
          import os

          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              def _local_model(
                  model_name="qwen3-vl:2b-instruct",
                  temperature=None,
                  timeout=None,
                  thinking_budget=None,
                  thinking_level=None,
                  include_thoughts=None,
                  enable_grounding=False,
                  **_kwargs,
              ):
                  endpoint = ModelEndpoint(
                      provider=ModelProvider.OLLAMA,
                      model_name=os.environ.get("ARTEMIS_LOCAL_MODEL", model_name),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 60.0,
                      thinking_budget=None,
                      thinking_level=None,
                      include_thoughts=include_thoughts,
                      enable_grounding=False,
                  )
                  return ModelFactory.create_model(endpoint)

              llm_service.get_google_llm = _local_model
              llm_service.get_vertex_llm = _local_model
          PY

          PYTHONPATH=$GITHUB_WORKSPACE/.artemis-local uv run python - <<'PY'
          import artemis.services.llm as service
          model = service.get_google_llm(model_name="gemini-2.5-flash")
          print("LOCAL_FALLBACK_OK", type(model).__name__)
          PY

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH=$GITHUB_WORKSPACE/.artemis-local

          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 1

          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            /home/runner/.cache/uv
            /home/runner/.ollama/models
          key: artemis-free-android34-qwen3vl-v5

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== ADB ==="
          adb devices -l
          echo "=== BATTERY ==="
          adb shell dumpsys battery
          echo "=== EMULATOR LOG ==="
          tail -250 /tmp/emulator.log
          echo "=== OLLAMA LOG ==="
          tail -250 /tmp/ollama.log
