name: Artemis Free Local Final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev

          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          if [ ! -f "$HOME/.android/adbkey" ]; then "$ANDROID_HOME/platform-tools/adb" keygen "$HOME/.android/adbkey"; fi

          ANDROID_USER_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_SDK_HOME="$RUNNER_TEMP/android-user-home"
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check

          rm -rf "${ANDROID_AVD_HOME}/artemis.avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          printf '\n' | timeout 60 avdmanager create avd \
            --force \
            --name artemis \
            --package "system-images;android-34;google_apis;x86_64" \
            --abi "x86_64" \
            --path "${ANDROID_AVD_HOME}/artemis.avd"

          test -f "${ANDROID_AVD_HOME}/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx "artemis"

          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect -accel on -debug-no-metrics             > /tmp/emulator.log 2>&1 &

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done

          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Verify local-only routing and guardrails
        shell: bash
        run: |
          set -euxo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("config/artemis.jsonc")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r'("max_turns"\s*:\s*)0', r'\g<1>6', text, count=1)
          if count != 1:
              raise SystemExit("Expected one flash max_turns value of 0")
          path.write_text(text, encoding="utf-8")
          print("LOCAL_FLASH_MAX_TURNS=6")
          PY

          uv run python - <<'PY'
          from langchain_openai import ChatOpenAI
          from langchain_core.tools import tool

          @tool
          def tap(x: int, y: int) -> str:
              """Preflight-only Android tap action."""
              return f"tap({x},{y})"

          llm = ChatOpenAI(
              model="qwen3-vl:2b-instruct",
              temperature=0.0,
              max_tokens=128,
              api_key="ollama",
              base_url="http://127.0.0.1:11434/v1",
              timeout=60.0,
          ).bind_tools([tap], tool_choice="required")
          response = llm.invoke("Call the tap tool once with x=1 and y=2. Do not answer with prose.")
          if not response.tool_calls:
              raise SystemExit(f"Qwen tool-calling preflight failed: {response.content!r}")
          print("LOCAL_TOOL_CALL_OK", response.tool_calls[0]["name"], response.tool_calls[0]["args"])
          PY

          uv run python - <<'PY'
          from artemis.config import initialize_llm_config
          c = initialize_llm_config()
          print("LOCAL_CONFIG_VALID", type(c).__name__)
          for role in ("planner", "operator", "explorer", "object_detector", "checker", "hopper"):
              cfg = c.get_agent(role)
              print(role, getattr(cfg, "provider", None), getattr(cfg, "model", None))
          PY

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== FINAL ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS ==="
          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery
          tail -200 /tmp/emulator.log
          journalctl -u ollama --no-pager -n 160 || true
