name: Artemis Free Local Final v4

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /home/runner/.ollama/models
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            /home/runner/.cache/uv
            /home/runner/.ollama/models
          key: artemis-free-android34-qwen3vl-v7
          restore-keys: |
            artemis-free-android34-qwen3vl-

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

          if ! dpkg -s libpulse0 >/dev/null 2>&1 ||              ! dpkg -s libx11-xcb1 >/dev/null 2>&1 ||              ! dpkg -s libx11-xcb-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev
          fi

          mkdir -p "$HOME/.android" "$RUNNER_TEMP/android-user-home" "$RUNNER_TEMP/android-avd"
          rm -f "$HOME/.android/emu-update-last-check.ini"

          echo "ANDROID_USER_HOME=$RUNNER_TEMP/android-user-home" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          if [ ! -x "$ANDROID_HOME/emulator/emulator" ] ||              [ ! -x "$ANDROID_HOME/platform-tools/adb" ] ||              [ ! -d "$ANDROID_HOME/platforms/android-34" ] ||              [ ! -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" ]; then
            sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          fi

          emulator -accel-check

          rm -rf "$ANDROID_AVD_HOME/artemis.avd"
          printf '
' | timeout 60 avdmanager create avd             --force             --name artemis             --package "system-images;android-34;google_apis;x86_64"             --abi x86_64             --path "$ANDROID_AVD_HOME/artemis.avd"

          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx "artemis"

          if [ ! -e "$HOME/.android/adbkey" ]; then
            adb keygen "$HOME/.android/adbkey"
          fi
          test -s "$HOME/.android/adbkey"
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"

          adb start-server
          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect -accel on             > /tmp/emulator.log 2>&1 &

          timeout 240 adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '')" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run python --version
          uv run ruff check artemis .artemis-local
          uv run python -m compileall -q artemis .artemis-local

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          sudo systemctl stop ollama >/dev/null 2>&1 || true
          mkdir -p "$OLLAMA_MODELS"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_MODELS="$OLLAMA_MODELS" ollama serve             > /tmp/ollama.log 2>&1 &

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct

          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Validate local-only runtime
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local"
          uv run python -m compileall -q artemis .artemis-local
          uv run ruff check artemis .artemis-local
          uv run python - <<'PY'
          from artemis.config import initialize_llm_config
          from artemis.services import llm as service_llm

          cfg = initialize_llm_config()
          model = service_llm.get_google_llm(model_name="gemini-2.5-flash")

          class Ctx:
              llm_config = cfg

          endpoint = service_llm._resolve_endpoint(Ctx(), "planner")
          assert endpoint.provider.value == "ollama", endpoint
          assert endpoint.model_name == "qwen3-vl:2b-instruct", endpoint
          assert "11434" in str(getattr(model, "base_url", "")), model
          print("LOCAL_LLM_ROUTING_OK")

      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local"
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 1

          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-34
            /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
            /home/runner/.cache/uv
            /home/runner/.ollama/models
          key: artemis-free-android34-qwen3vl-v7

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== ADB ==="
          adb devices -l
          echo "=== BATTERY ==="
          adb shell dumpsys battery
          echo "=== EMULATOR LOG ==="
          tail -300 /tmp/emulator.log
          echo "=== OLLAMA LOG ==="
          tail -300 /tmp/ollama.log
