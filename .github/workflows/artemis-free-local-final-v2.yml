name: Artemis Free Local Final v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
      ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_GPU: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODELS: /tmp/ollama-models
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5

      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-dev
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          {
            echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$HOME/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check
          rm -rf "$ANDROID_AVD_HOME/artemis.avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | timeout 60 avdmanager create avd             --force             --name artemis             --package "system-images;android-34;google_apis;x86_64"             --abi x86_64             --path "$ANDROID_AVD_HOME/artemis.avd"
          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx artemis
          nohup emulator @artemis             -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data             -gpu swiftshader_indirect -accel on             >/tmp/emulator.log 2>&1 &
          adb start-server
          timeout 240 adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run ruff check artemis

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct
          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H 'Content-Type: application/json'             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json
          grep -q '"content"' /tmp/qwen-smoke.json

      - name: Configure Artemis for local provider
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("config/artemis.jsonc")
          s = p.read_text(encoding="utf-8")
          s = s.replace('"provider": "google"', '"provider": "openai"')
          s = re.sub(r'"model":\s*"gemini-[^"]+"', '"model": "qwen3-vl:2b-instruct"', s)
          s = re.sub(r'"model":\s*"gemini-robotics-er-2-preview"', '"model": "qwen3-vl:2b-instruct"', s)
          p.write_text(s, encoding="utf-8")
          PY
          ! grep -n '"provider": "google"\|"model": "gemini-' config/artemis.jsonc
          uv run python - <<'PY'
          from artemis.config import get_default_llm_config
          cfg = get_default_llm_config()
          cfg.validate_providers()
          for name in ("planner", "operator", "summarizer", "checker"):
              node = getattr(cfg, name)
              assert node.provider == "openai", (name, node.provider)
              assert node.model == "qwen3-vl:2b-instruct", (name, node.model)
          print("LOCAL_CONFIG_VALID=1")
          PY

      - name: Install local-only runtime patch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.artemis-local"
          cat > "$GITHUB_WORKSPACE/.artemis-local/sitecustomize.py" <<'PY'
          import os
          if os.environ.get("ARTEMIS_LOCAL_ONLY") == "1":
              from artemis.llm.router import ModelEndpoint, ModelFactory, ModelProvider
              import artemis.services.llm as llm_service

              def local_endpoint(temperature=None, timeout=None):
                  return ModelEndpoint(
                      provider=ModelProvider.OPENAI,
                      model_name=os.environ.get("ARTEMIS_LOCAL_MODEL", "qwen3-vl:2b-instruct"),
                      temperature=temperature or 0.0,
                      timeout_seconds=timeout or 180.0,
                      is_multimodal=True,
                  )

              def local_google_llm(*args, temperature=None, timeout=None, **kwargs):
                  return ModelFactory.create_model(local_endpoint(temperature, timeout))

              llm_service.get_google_llm = local_google_llm
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local" uv run python - <<'PY'
          import artemis.services.llm as s
          m = s.get_google_llm(model_name="gemini-2.5-flash")
          print("LOCAL_GOOGLE_FALLBACK_TYPE=", type(m).__name__)
          PY

      - name: Run Artemis local-only
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.artemis-local
        run: |
          set -euxo pipefail
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2
          timeout 600 uv run artemis run             "Open Settings and report the battery percentage. Do not open any unrelated app."             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== ADB ==="
          adb devices -l
          echo "=== BATTERY ==="
          adb shell dumpsys battery
          echo "=== EMULATOR LOG ==="
          tail -250 /tmp/emulator.log
          echo "=== OLLAMA ==="
          systemctl status ollama --no-pager || true
          journalctl -u ollama --no-pager -n 250 || true
