name: Artemis Free Local AI Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      OLLAMA_HOST: 127.0.0.1:11434
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1

    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v4

      - name: Enable KVM and emulator runtime libraries
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0
          echo "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"
          ls -l /dev/kvm
          ldconfig -p | grep -F 'libpulse.so.0' || true

      - name: Boot Android Emulator directly
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== ANDROID SDK ==="
          sdkmanager --version

          echo "=== INSTALL REQUIRED PACKAGES ==="
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"

          echo "=== ANDROID TOOLCHAIN ==="
          emulator -version
          adb version
          emulator -accel-check

          echo "=== CREATE AVD ==="
          mkdir -p "$HOME/.android/avd"
          rm -rf "$HOME/.android/avd/artemis.avd" "$HOME/.android/avd/artemis.ini"
          echo "no" | avdmanager create avd             -n artemis             -k "system-images;android-34;google_apis;x86_64"
          cat "$HOME/.android/avd/artemis.avd/config.ini"

          echo "=== START EMULATOR ==="
          nohup emulator @artemis             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -wipe-data             -gpu swiftshader_indirect             -accel on             > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid

          adb start-server
          timeout 240 adb wait-for-device

          for i in $(seq 1 180); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then
              break
            fi
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "=== DEVICE ==="
          adb devices -l
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell wm size
          adb shell dumpsys battery | sed -n '1,25p'

      - name: Install Artemis dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          uv --version
          uv sync --frozen

      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== OLLAMA INSTALL ==="
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          echo "=== WAIT FOR OLLAMA SERVICE ==="
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

          echo "=== PULL QWEN3-VL ==="
          ollama pull qwen3-vl:2b-instruct

          echo "=== LOCAL MODEL SMOKE ==="
          curl -fsS http://127.0.0.1:11434/v1/chat/completions             -H "Content-Type: application/json"             -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}'             | tee /tmp/qwen-smoke.json

      - name: Configure Artemis for local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          import json
          from artemis.utils.file import load_jsonc

          model = "qwen3-vl:2b-instruct"
          src = Path("config/artemis.jsonc")
          with src.open(encoding="utf-8") as f:
              data = load_jsonc(f)

          def patch(node):
              if isinstance(node, dict):
                  if "provider" in node:
                      node["provider"] = "ollama"
                  if "model" in node and isinstance(node["model"], str):
                      node["model"] = model
                  for value in node.values():
                      patch(value)
              elif isinstance(node, list):
                  for value in node:
                      patch(value)

          patch(data)
          if isinstance(data.get("default"), dict):
              data["default"]["provider"] = "ollama"
              data["default"]["model"] = model

          src.write_text(json.dumps(data, indent=2), encoding="utf-8")
          print("patched config/artemis.jsonc")
          PY

      - name: Run Artemis on emulator
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== PRE-ARTEMIS ADB CHECK ==="
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2

          echo "=== ARTEMIS REAL LOCAL AI RUN ==="
          uv run artemis run             "Open Settings and report the battery percentage"             --profile flash             --without-video-recording-tools             --disable-step-summarizer             --disable-outputter             --disable-checker             --disable-planner-validation             --standalone

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== ADB ==="
          adb devices -l || true
          adb shell dumpsys battery || true
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          echo "=== EMULATOR LOG ==="
          tail -200 /tmp/emulator.log || true
          echo "=== OLLAMA LOG ==="
          journalctl -u ollama --no-pager -n 200 || true
