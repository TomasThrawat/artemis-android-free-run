name: Artemis Free Local Final v3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-agent:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: /tmp/artemis-android-user-home
      ANDROID_AVD_HOME: /tmp/artemis-android-avd
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_GPU: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODELS: /tmp/ollama-models
      OPENAI_API_KEY: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      ARTEMIS_LOCAL_ONLY: "1"
      ARTEMIS_LOCAL_MODEL: qwen3-vl:2b-instruct
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v5
      - name: Prepare host
        shell: bash
        run: |
          set -euxo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-xcb1 libx11-xcb-dev libx11-dev
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$HOME/.android"
          rm -f "$HOME/.android/emu-update-last-check.ini"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Boot Android Emulator
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "emulator" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          emulator -accel-check
          rm -rf "$ANDROID_AVD_HOME/artemis.avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '\n' | timeout 60 avdmanager create avd --force --name artemis --package "system-images;android-34;google_apis;x86_64" --abi x86_64 --path "$ANDROID_AVD_HOME/artemis.avd"
          test -f "$ANDROID_AVD_HOME/artemis.avd/config.ini"
          emulator -list-avds | grep -Fx artemis
          ln -sfn /usr/lib/x86_64-linux-gnu/libX11-xcb.so.1 /usr/lib/x86_64-linux-gnu/libX11-xcb.so || true
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          nohup emulator @artemis -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -wipe-data -gpu swiftshader_indirect -accel on >/tmp/emulator.log 2>&1 &
          if [ ! -s "$HOME/.android/adbkey" ]; then
            adb keygen "$HOME/.android/adbkey"
          fi
          test -s "$HOME/.android/adbkey"
          export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
          adb start-server
          timeout 240 adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l
          adb shell dumpsys battery | sed -n '1,25p'
      - name: Install Artemis
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
          uv run ruff check .
          uv run python -m compileall -q artemis .artemis-local
      - name: Start local Qwen3-VL
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ollama >/dev/null 2>&1; then curl -fsSL https://ollama.com/install.sh | sh; fi
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-vl:2b-instruct
          curl -fsS http://127.0.0.1:11434/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"qwen3-vl:2b-instruct","messages":[{"role":"user","content":"Reply with OK only."}],"max_tokens":16}' | tee /tmp/qwen-smoke.json
          grep -q '"content"' /tmp/qwen-smoke.json
      - name: Probe Qwen tool calling
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          tool = {
              "type": "function",
              "function": {
                  "name": "report_task_status",
                  "description": "Report task completion.",
                  "parameters": {
                      "type": "object",
                      "properties": {
                          "status": {"type": "string"},
                          "explanation": {"type": "string"},
                      },
                      "required": ["status", "explanation"],
                  },
              },
          }
          body = json.dumps({
              "model": os.environ["ARTEMIS_LOCAL_MODEL"],
              "messages": [{"role": "user", "content": "Use the provided tool now."}],
              "tools": [tool],
              "tool_choice": "required",
              "max_tokens": 64,
              "stream": False,
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:11434/v1/chat/completions",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=90) as response:
              result = json.load(response)
          message = result["choices"][0]["message"]
          calls = message.get("tool_calls") or []
          content = message.get("content") or ""
          assert calls or "<tool_call>" in content, result
          print("QWEN_TOOL_CALL_PROBE_OK")
          print("NATIVE_TOOL_CALLS", len(calls))
          PY
      - name: Configure Artemis for local provider
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("config/artemis.jsonc")
          s=p.read_text(encoding="utf-8")
          s=s.replace('"provider": "google"','"provider": "openai"')
          s=re.sub(r'"model":\s*"gemini-[^"]+"','"model": "qwen3-vl:2b-instruct"',s)
          s=re.sub(r'"model":\s*"gemini-robotics-er-2-preview"','"model": "qwen3-vl:2b-instruct"',s)
          p.write_text(s,encoding="utf-8")
          PY
          ! grep -n '"provider": "google"\|"model": "gemini-' config/artemis.jsonc
          uv run python - <<'PY'
          from artemis.config import get_default_llm_config
          cfg=get_default_llm_config()
          cfg.validate_providers()
          assert cfg.planner.provider == "openai"
          assert cfg.operator.provider == "openai"
          assert cfg.planner.model == "qwen3-vl:2b-instruct"
          assert cfg.operator.model == "qwen3-vl:2b-instruct"
          print("LOCAL_CONFIG_VALID=1")
          PY
      - name: Run Artemis local-only
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.artemis-local"
          adb shell settings put global stay_on_while_plugged_in 3
          adb devices -l
          adb shell am start -a android.settings.SETTINGS
          sleep 2
          timeout 300 uv run artemis run "Open Settings, use the device action tool to navigate there, and when the battery percentage is visible call report_task_status with the battery percentage. Do not reply with plain prose before calling a tool." --profile flash --without-video-recording-tools --disable-step-summarizer --disable-outputter --disable-checker --disable-planner-validation --standalone
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          adb devices -l
          adb shell dumpsys battery
          systemctl status ollama --no-pager || true
          journalctl -u ollama --no-pager -n 250 || true
          tail -250 /tmp/emulator.log
